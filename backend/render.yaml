services:
  - type: web
    name: crimora-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://crimora.vercel.app,http://localhost:3000"
      - key: MODEL_ARTIFACTS_DIR
        value: "./artifacts"
      - key: DATA_DIR
        value: "./data"
    plan: free
